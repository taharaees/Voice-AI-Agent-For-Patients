services:
  - type: web
    name: voice-ai-patient-registration
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: VAPI_SERVER_SECRET
        generateValue: true
      - key: PUBLIC_API_BASE_URL
        sync: false
